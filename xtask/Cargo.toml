[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Development tasks for the marcasite workspace (run with `cargo xtask`)"

[dependencies]
anyhow = "1.0.98"
# Exact version: its FORMAT_VERSION must match the rustdoc JSON emitted by the nightly pinned in
# `src/docs/json.rs` (`NIGHTLY`). Bump the two together.
rustdoc-types = "=0.61.0"
serde_json = { workspace = true }

[lints]
workspace = true
