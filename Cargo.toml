[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/harrydayexe/polyoxide"
description = "Unofficial Rust SDK for the Polymarket Predictions APIs"
keywords = ["polymarket", "prediction-markets", "sdk", "api", "trading"]
categories = ["api-bindings", "web-programming::http-client", "finance"]

[workspace.dependencies]
polyoxide-core = { path = "crates/polyoxide-core", version = "0.1.0", default-features = false }
chrono = { version = "0.4.41", default-features = false, features = ["std", "serde"] }
futures-core = { version = "0.3.31", default-features = false, features = ["std"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "sink"] }
http = "1.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "gzip", "system-proxy"] }
rust_decimal = { version = "1.38", default-features = false, features = ["std", "serde", "serde-with-str", "serde-with-float"] }
rustls = { version = "0.23.27", default-features = false, features = ["std", "tls12", "aws_lc_rs", "logging"] }
rustls-native-certs = "0.8.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_path_to_error = "0.1.17"
thiserror = "2.0.12"
tokio = { version = "1.45", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tracing = "0.1.41"
url = "2.5.4"
wiremock = "0.6.3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "warn"
missing_errors_doc = "warn"
