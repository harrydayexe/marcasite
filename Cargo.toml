[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/harrydayexe/polyoxide"
description = "Unofficial Rust SDK for the Polymarket Predictions APIs"

[workspace.dependencies]
polyoxide-core = { path = "crates/polyoxide-core", version = "0.1.0" }
tokio = { version = "1", default-features = false }
tracing = "0.1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
