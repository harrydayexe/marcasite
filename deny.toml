# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained (no fix available). It is not a known vulnerability. chrono is in
    # marcasite's public API (DateTime<Utc>) and also comes in through rmcp/schemars for
    # marcasite-mcp. Replacing it (jiff or time) is a breaking change, tracked in OPEN_QUESTIONS.md.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migration tracked in OPEN_QUESTIONS.md" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Mozilla's root certificate data (webpki-root-certs, via reqwest -> rustls-platform-verifier).
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
