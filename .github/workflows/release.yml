name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  push_to_crates_io:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Pre-Release Test
        run: cargo test --all-features

      - name: Publish Crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "marcasite ${TAG#v}" --generate-notes --verify-tag
